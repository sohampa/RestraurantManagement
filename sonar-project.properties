# SonarQube / SonarCloud project identification
sonar.projectKey=almcybage_restraurantmanagement
sonar.organization=almcybage
sonar.host.url=https://sonarcloud.io
sonar.token=${env.SONAR_TOKEN}

# Optional for SonarQube Server. Uncomment and set if not using SonarCloud.
# sonar.host.url=https://your-sonarqube-server

# Source and test layout
sonar.sources=frontend/src,backend/src
sonar.tests=frontend/src,backend/test

# Test file patterns
sonar.test.inclusions=frontend/src/**/*.test.jsx,frontend/src/**/*.test.js,backend/test/**/*.test.js

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/.vite/**

# JavaScript/TypeScript coverage reports (if generated)
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info,backend/coverage/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8
