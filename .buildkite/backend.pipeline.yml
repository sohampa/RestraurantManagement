steps:
  - group: ":nodejs: Backend Pipeline"
    key: "backend-pipeline"

    if_changed:
      - "backend/**"
      - ".buildkite/backend.pipeline.yml"

    steps:
      - label: ":test_tube: Backend Test"
        key: "backend-test"

        command: |
          set -eu

          echo "--- Installing backend dependencies"
          cd backend
          npm ci

          echo "--- Running backend tests"
          npm test

        plugins:
          - docker#v5.14.0:
              image: "node:24-alpine"
              propagate-uid-gid: true
              environment:
                - "HOME=/tmp"
                - "NPM_CONFIG_CACHE=/tmp/npm-cache"

      - label: ":hammer: Backend Build"
        key: "backend-build"
        depends_on:
          - "backend-test"

        command: |
          set -eu

          cd backend

          echo "--- Installing production dependencies"
          npm ci --omit=dev

          echo "--- Validating backend package"
          npm pack --dry-run

        plugins:
          - docker#v5.14.0:
              image: "node:24-alpine"
              propagate-uid-gid: true
              environment:
                - "HOME=/tmp"
                - "NPM_CONFIG_CACHE=/tmp/npm-cache"

      - label: ":docker: Backend Docker Image"
        key: "backend-docker"
        depends_on:
          - "backend-build"

        command: |
          set -eu

          IMAGE_TAG="build-${BUILDKITE_BUILD_NUMBER}-${BUILDKITE_COMMIT:0:12}"

          echo "--- Build backend Docker image"

          docker build \
            --file backend/Dockerfile \
            --tag "forkflow-backend:${IMAGE_TAG}" \
            backend

          echo "--- Verify Docker image"

          docker image inspect \
            "forkflow-backend:${IMAGE_TAG}" >/dev/null

          echo "--- Export Docker image"

          mkdir -p docker-images

          docker save \
            "forkflow-backend:${IMAGE_TAG}" \
            | gzip > "docker-images/forkflow-backend-${IMAGE_TAG}.tar.gz"

          echo "Backend Docker image created:"
          echo "forkflow-backend:${IMAGE_TAG}"

        artifact_paths:
          - "docker-images/*.tar.gz"
