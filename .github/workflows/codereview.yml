name: Claude Code Review

on:
  workflow_dispatch:

  issue_comment:
    types: [created]

  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

jobs:
  claude-review:
    if: |
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        contains(github.event.comment.body, '@claude')
      )

    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write
      pull-requests: write
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          track_progress: true

          prompt: |
            REPO: ${{ github.repository }}

            Review the pull request thoroughly.

            Focus on:
            - Bugs and logical errors
            - Security vulnerabilities
            - Code quality
            - Performance
            - Error handling
            - Missing unit tests
            - Maintainability
            - CI/CD and workflow reliability

            Provide:
            - A PR-level summary
            - Specific actionable findings
            - At least 3 improvement suggestions where applicable
            - Inline comments for file-specific issues when possible
            - Test recommendations

            If no blocking issues are found, clearly state that and
            still provide useful non-blocking improvements.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
